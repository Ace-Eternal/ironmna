version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: ironman-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: iron_management
      MYSQL_USER: ${DB_USERNAME:-iron_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  backend:
    image: ${BACKEND_IMAGE:-ironman-backend:local}
    build:
      context: ./iron-management-backend
    container_name: ironman-backend
    depends_on:
      - mysql
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8888
      SERVER_CONTEXT_PATH: /iron
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: iron_management
      DB_USERNAME: ${DB_USERNAME:-iron_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      APP_TEMPLATE_PATH: /opt/ironman/resources/template.docx
      APP_EXPORT_DIR: /tmp/ironman-exports
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?set APP_CORS_ALLOWED_ORIGINS}
      APP_AUTH_ALLOW_LEGACY_PLAINTEXT_PASSWORDS: ${APP_AUTH_ALLOW_LEGACY_PLAINTEXT_PASSWORDS:false}
      MATERIAL_RECOGNITION_API_KEY: ${MATERIAL_RECOGNITION_API_KEY:-}
    volumes:
      - ./word-template/template.docx:/opt/ironman/resources/template.docx:ro

  frontend:
    image: ${FRONTEND_IMAGE:-ironman-frontend:local}
    build:
      context: ./react-admin-design-main
    container_name: ironman-frontend
    depends_on:
      - backend
    ports:
      - "8201:8080"

volumes:
  mysql-data:
